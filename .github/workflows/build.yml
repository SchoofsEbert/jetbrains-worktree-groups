name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release half-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and verify
        run: ./gradlew build buildPlugin verifyPlugin -PpluginVersion=$VERSION

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="worktree-groups-$VERSION.zip"
          cat > updatePlugins.xml <<EOF
          <plugins>
            <plugin id="io.github.schoofsebert.worktree-groups" version="$VERSION"
                    url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$zip">
              <idea-version since-build="262"/>
              <name>Worktree Groups</name>
              <vendor>Ebert Schoofs</vendor>
              <description>Groups git worktrees in Recent Projects and drops removed ones.</description>
            </plugin>
          </plugins>
          EOF
          gh release create "v$VERSION" "build/distributions/$zip" updatePlugins.xml \
            --title "v$VERSION" --generate-notes --latest
